[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chesterton-fence"
version = "0.1.0"
description = "Warns when a change removes code that history says exists for a reason."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "rich>=13.7",
  "tree-sitter>=0.23",
  "tree-sitter-c>=0.23",
  "tree-sitter-cpp>=0.23",
  "tree-sitter-go>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-rust>=0.23",
  "tree-sitter-typescript>=0.23",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chesterton = "chesterton.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["chesterton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
